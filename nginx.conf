server {
    listen 80;
    server_name _;

    root /var/www/events/dist;
    index index.html;

    location = /api/events.php {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
